<title>Frost Wit — Software Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--card:#141417;--border:#222227;--text:#fafafa;--muted:#9ca3af;--accent:#7c3aed;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6}
.mono{font-family:'JetBrains Mono',monospace}
nav{position:sticky;top:0;z-index:10;background:rgba(10,10,11,0.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
nav b{font-weight:900;letter-spacing:-0.05em}
nav a{color:var(--muted);text-decoration:none;font-size:14px;margin-left:20px}.dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hero{max-width:1100px;margin:0 auto;padding:80px 24px 40px}
.badge{border:1px solid var(--border);background:var(--card);padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
h1{font-size:clamp(40px,8vw,84px);font-weight:900;line-height:0.9;letter-spacing:-0.05em;margin:24px 0}
